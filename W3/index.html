<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業四 - 敲敲話 Whisper Box</title>
    <!-- 引入 Google Fonts 可愛圓潤字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiyom+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- 引入 html2canvas CDN 供截圖下載卡片使用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* ==================== 基礎與變數設定 ==================== */
        :root {
            --bg-grad-1: #ffe6f2;
            --bg-grad-2: #e8f4ff;
            --bg-grad-3: #fff3e0;
            --primary-pink: #ff85a1;
            --primary-purple: #b39ddb;
            --card-bg: #ffffff;
            --text-dark: #5a4b5c;
            --text-muted: #a099a8;
            --shadow-pop: 0 10px 25px rgba(255, 133, 161, 0.25);
            --shadow-card: 0 8px 20px rgba(180, 160, 200, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', 'Mochiyom Pop One', sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 浮動氣泡背景裝飾 */
        .bg-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            animation: floatUp 8s infinite ease-in-out;
        }

        .bubble:nth-child(1) { width: 60px; height: 60px; left: 10%; animation-duration: 7s; }
        .bubble:nth-child(2) { width: 90px; height: 90px; left: 85%; animation-duration: 9s; animation-delay: 1s; }
        .bubble:nth-child(3) { width: 40px; height: 40px; left: 70%; animation-duration: 6s; animation-delay: 2s; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .container {
            max-width: 1050px;
            width: 100%;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 頂部標題 */
        .header-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-title h1 {
            font-family: 'Mochiyom Pop One', sans-serif;
            font-size: 2rem;
            color: #524364;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0px #fff;
        }

        .header-title p {
            font-size: 0.95rem;
            color: #8c7b99;
            font-weight: 700;
        }

        /* ==================== 左右雙欄主佈局 (RWD) ==================== */
        .generator-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            align-items: start;
        }

        @media (max-width: 768px) {
            .generator-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 控制面板卡片 & 預覽卡片通用樣式 */
        .panel-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 25px;
            border: 4px solid #ffffff;
            box-shadow: var(--shadow-pop);
            width: 100%;
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: #524364;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 表單控制元件 */
        .control-group {
            margin-bottom: 18px;
        }

        .control-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 700;
            color: #7d6b8d;
            margin-bottom: 6px;
        }

        /* 自定義上傳檔案按鈕外觀 */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-upload-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #fff;
            text-align: center;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 133, 161, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .file-upload-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .file-upload-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        /* 文字輸入框與多行輸入框 */
        .text-input, .textarea-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            border: 2px solid #e0d4e8;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
            background: #faf6fd;
            outline: none;
            transition: border-color 0.2s;
        }

        .textarea-input {
            resize: vertical;
            min-height: 80px;
        }

        .text-input:focus, .textarea-input:focus {
            border-color: var(--primary-pink);
            background: #fff;
        }

        /* 滑桿調整區 */
        .range-slider {
            width: 100%;
            accent-color: #ff85a1;
            cursor: pointer;
        }

        .range-value {
            float: right;
            font-size: 0.8rem;
            color: #b39ddb;
            font-weight: bold;
        }

        /* ==================== 敲敲話即時預覽區 ==================== */
        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 卡片畫布主體 (截圖範圍) */
        #whisper-canvas-box {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 4 / 3;
            background: #f4ecf9;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #whisper-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* 敲敲話文字特效 (加上黑色外框與影線) */
        .whisper-text {
            position: absolute;
            width: 90%;
            text-align: center;
            font-family: 'Mochiyom Pop One', sans-serif;
            color: #ffffff;
            text-shadow:
                -3px -3px 0 #000,  
                 3px -3px 0 #000,
                -3px  3px 0 #000,
                 3px  3px 0 #000,
                 0px  4px 8px rgba(0,0,0,0.6);
            left: 50%;
            transform: translateX(-50%);
            word-break: break-all;
            pointer-events: none;
            line-height: 1.3;
            white-space: pre-wrap;
        }

        #title-text-view {
            top: 10%;
        }

        #message-text-view {
            bottom: 15%;
        }

        /* 提示文字 */
        .upload-tip {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            margin: auto;
            padding: 20px;
        }

        /* 下載按鈕 */
        .download-btn {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #b39ddb, #9575cd);
            color: #fff;
            font-family: 'Mochiyom Pop One', sans-serif;
            font-size: 1rem;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(179, 157, 219, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(179, 157, 219, 0.6);
        }

        .download-btn:active {
            transform: translateY(-1px);
        }

        /* 返回作品集按鈕列 */
        .back-nav {
            margin-top: 30px;
            text-align: center;
        }

        .back-link {
            text-decoration: none;
            color: #8c7b99;
            font-weight: 700;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.7);
            padding: 8px 18px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .back-link:hover {
            background: #fff;
            color: #ff85a1;
        }

        /* 頁尾 */
        footer {
            margin-top: 30px;
            color: #8c7b99;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 背景動態氣泡 -->
    <div class="bg-bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <!-- 網頁標題區 -->
        <div class="header-title">
            <h1>💌 作業四 - 敲敲話產生器</h1>
            <p>✨ 寫下你想說的秘密或悄悄話，製作專屬心情圖片！✨</p>
        </div>

        <!-- 左右雙欄配置：左側控制面板、右側即時預覽 -->
        <div class="generator-layout">
            
            <!-- 左側：控制面板 -->
            <div class="panel-card">
                <div class="panel-title"><span>🛠️</span> 敲敲話設定選單</div>

                <!-- 1. 背景圖片上傳 -->
                <div class="control-group">
                    <label>1. 選擇底圖 (本機上傳)</label>
                    <div class="file-upload-wrapper">
                        <span class="file-upload-btn">📁 點擊上傳背景圖</span>
                        <input type="file" id="image-input" accept="image/*">
                    </div>
                </div>

                <!-- 2. 主題 / 抬頭 -->
                <div class="control-group">
                    <label>2. 敲敲話主題 (抬頭)</label>
                    <input type="text" id="title-text-input" class="text-input" placeholder="例如：給最棒的你..." value="給親愛的你：">
                </div>

                <!-- 3. 內文悄悄話 -->
                <div class="control-group">
                    <label>3. 悄悄話內容</label>
                    <textarea id="message-text-input" class="textarea-input" placeholder="寫下想傳達的心聲..." rows="3">不論今天過得如何，都要記得對自己好一點喔！加油！</textarea>
                </div>

                <!-- 4. 字體大小滑桿 -->
                <div class="control-group">
                    <label>4. 字體大小 <span id="font-size-val" class="range-value">22px</span></label>
                    <input type="range" id="font-size-range" class="range-slider" min="14" max="48" value="22">
                </div>

                <!-- 5. 抬頭位置滑桿 -->
                <div class="control-group">
                    <label>5. 抬頭垂直位置 <span id="top-pos-val" class="range-value">10%</span></label>
                    <input type="range" id="top-pos-range" class="range-slider" min="2" max="50" value="10">
                </div>

                <!-- 6. 內文位置滑桿 -->
                <div class="control-group">
                    <label>6. 內文垂直位置 <span id="bottom-pos-val" class="range-value">15%</span></label>
                    <input type="range" id="bottom-pos-range" class="range-slider" min="2" max="50" value="15">
                </div>
            </div>

            <!-- 右側：即時預覽與下載區 -->
            <div class="preview-container">
                <div class="panel-card" style="display: flex; flex-direction: column; align-items: center;">
                    <div class="panel-title" style="align-self: flex-start;"><span>👀</span> 即時預覽區</div>
                    
                    <!-- 包含圖片與文字的卡片畫布容器 (html2canvas 截圖目標) -->
                    <div id="whisper-canvas-box">
                        <div id="upload-tip" class="upload-tip">請先於左側上傳背景圖 🐾</div>
                        <img id="whisper-image" style="display: none;" alt="背景圖">
                        <div id="title-text-view" class="whisper-text">給親愛的你：</div>
                        <div id="message-text-view" class="whisper-text">不論今天過得如何，都要記得對自己好一點喔！加油！</div>
                    </div>

                    <!-- 下載按鈕 -->
                    <button id="download-btn" class="download-btn">
                        <span>📥</span> 下載敲敲話卡片 (whisper-card.png)
                    </button>
                </div>
            </div>

        </div>

        <!-- 返回入口首頁按鈕 -->
        <div class="back-nav">
            <a href="../index.html" class="back-link">🏠 回到作品集入口地圖</a>
        </div>

        <footer>
            © 2026 網頁程式設計課程作品集 | Keep Coding & Stay Cute!
        </footer>
    </div>

    <!-- ==================== JavaScript 功能實作 ==================== -->
    <script>
        // 取得 DOM 元素
        const imageInput = document.getElementById('image-input');
        const whisperImage = document.getElementById('whisper-image');
        const uploadTip = document.getElementById('upload-tip');

        const titleTextInput = document.getElementById('title-text-input');
        const messageTextInput = document.getElementById('message-text-input');
        const titleTextView = document.getElementById('title-text-view');
        const messageTextView = document.getElementById('message-text-view');

        const fontSizeRange = document.getElementById('font-size-range');
        const fontSizeVal = document.getElementById('font-size-val');

        const topPosRange = document.getElementById('top-pos-range');
        const topPosVal = document.getElementById('top-pos-val');

        const bottomPosRange = document.getElementById('bottom-pos-range');
        const bottomPosVal = document.getElementById('bottom-pos-val');

        const downloadBtn = document.getElementById('download-btn');
        const whisperCanvasBox = document.getElementById('whisper-canvas-box');

        // 1. 本機圖片上傳預覽
        imageInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    whisperImage.src = e.target.result;
                    whisperImage.style.display = 'block';
                    uploadTip.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // 2. 即時同步抬頭文字
        titleTextInput.addEventListener('input', function() {
            titleTextView.textContent = this.value;
        });

        // 3. 即時同步悄悄話內文
        messageTextInput.addEventListener('input', function() {
            messageTextView.textContent = this.value;
        });

        // 4. 即時調整字體大小
        fontSizeRange.addEventListener('input', function() {
            const size = this.value + 'px';
            titleTextView.style.fontSize = size;
            messageTextView.style.fontSize = size;
            fontSizeVal.textContent = size;
        });

        // 5. 即時調整抬頭位置
        topPosRange.addEventListener('input', function() {
            const pos = this.value + '%';
            titleTextView.style.top = pos;
            topPosVal.textContent = pos;
        });

        // 6. 即時調整內文位置
        bottomPosRange.addEventListener('input', function() {
            const pos = this.value + '%';
            messageTextView.style.bottom = pos;
            bottomPosVal.textContent = pos;
        });

        // 7. 一鍵截圖下載功能
        downloadBtn.addEventListener('click', function() {
            if (whisperImage.style.display === 'none') {
                alert('請先上傳一張背景圖才能下載敲敲話卡片唷！✨');
                return;
            }

            html2canvas(whisperCanvasBox, {
                useCORS: true,
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'whisper-card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error('截圖失敗：', err);
                alert('圖片下載時發生問題，請稍後再試！');
            });
        });
    </script>
</body>
</html>
