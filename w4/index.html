<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 | Live Memories Spotlight</title>

  <!-- 引入 Google Fonts 提升質感字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- ==========================================================================
       CSS 樣式設定 (高質感暗色風格 / Premium Dark Minimalist)
       ========================================================================== -->
  <style>
    /* ----------------------------------------------------------------------
       1. 全局變數設定（【顏色與質感調整區】）
       ---------------------------------------------------------------------- */
    :root {
      /* 主背景顏色：極緻深邃石墨黑 */
      --bg-color: #0b0d12;
      
      /* 卡片背景：微透光玻璃質感 */
      --card-bg: rgba(23, 27, 36, 0.75);
      --card-bg-highlight: rgba(35, 42, 56, 0.95);
      
      /* 文字顏色 */
      --text-main: #f1f5f9;              /* 主文字：柔和暖白 */
      --text-muted: #8e9aaf;             /* 次要/時間文字：質感灰藍 */
      --text-accent: #f59e0b;            /* 強調文字：暖琥珀金 */

      /* 【高亮光暈與邊框顏色】 */
      --highlight-border: #f59e0b;       /* 高亮時邊框：琥珀金 */
      --highlight-shadow: rgba(245, 158, 11, 0.35); /* 高亮光暈：柔和暖光 (RGBA) */
      --card-border-default: rgba(255, 255, 255, 0.08); /* 平時邊框：微弱透光白 */

      /* 字體設定 */
      --font-title: 'Noto Serif TC', serif, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 3rem 1.5rem;
      /* 背景加上優雅的漸層暗光 */
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.05) 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.03) 0%, transparent 50%);
      background-attachment: fixed;
    }

    /* 頁頭標題區 */
    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    header h1 {
      font-family: var(--font-title);
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 0.6rem;
      background: linear-gradient(135deg, #ffffff 30%, var(--text-accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 300;
    }

    /* ----------------------------------------------------------------------
       2. 『讀取留言中...』酷炫微光動畫 (Loading Animation)
       ---------------------------------------------------------------------- */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 0;
    }

    /* 質感雙環旋轉器 */
    .loader-ring {
      position: relative;
      width: 60px;
      height: 60px;
      margin-bottom: 1.5rem;
    }

    .loader-ring div {
      box-sizing: border-box;
      display: block;
      position: absolute;
      width: 48px;
      height: 48px;
      margin: 6px;
      border: 3px solid transparent;
      border-radius: 50%;
      animation: loader-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      border-color: var(--text-accent) transparent transparent transparent;
    }

    .loader-ring div:nth-child(1) { animation-delay: -0.45s; }
    .loader-ring div:nth-child(2) { animation-delay: -0.3s; }
    .loader-ring div:nth-child(3) { animation-delay: -0.15s; }

    @keyframes loader-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading p {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 2px;
      animation: pulse-text 2s infinite ease-in-out;
    }

    @keyframes pulse-text {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; color: var(--text-main); }
    }

    /* ----------------------------------------------------------------------
       3. 瀑布流排版 (Masonry Layout via Column Count)
       ---------------------------------------------------------------------- */
    .masonry-wall {
      column-count: 3;          /* 預設大螢幕顯示 3 欄 */
      column-gap: 1.8rem;
      max-width: 1240px;
      margin: 0 auto;
      perspective: 1000px;
    }

    /* 響應式斷點調整 */
    @media (max-width: 960px) {
      .masonry-wall { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-wall { column-count: 1; }
    }

    /* ----------------------------------------------------------------------
       4. 留言卡片基礎樣式與動態效果 (Glassmorphism Style)
       ---------------------------------------------------------------------- */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border-default);
      border-radius: 16px;
      padding: 1.6rem;
      margin-bottom: 1.8rem;
      break-inside: avoid; /* 防止瀑布流將卡片分割開來 */
      
      /* 高質感轉場動畫參數 (淡入淡出、縮放、發光) */
      transition: 
        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.7s ease,
        box-shadow 0.7s ease,
        opacity 0.7s ease,
        filter 0.7s ease,
        background-color 0.7s ease;
        
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    /* 卡片頭部 (名字與時間) */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-name {
      font-family: var(--font-title);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* 卡片內容 (悄悄話) */
    .card-content {
      font-size: 0.98rem;
      line-height: 1.7;
      color: #d1d5db;
      white-space: pre-wrap; /* 保留原留言的換行格式 */
      word-break: break-word;
    }

    /* ----------------------------------------------------------------------
       5. 【重點特效】輪播焦點 Highlight vs 非焦點影藏 Blur
       ---------------------------------------------------------------------- */
    /* 被選中的卡片 (高亮亮起 & 放大發光) */
    .card.highlight {
      transform: scale(1.06) translateY(-4px); /* 放大並微微浮起 */
      background-color: var(--card-bg-highlight);
      border-color: var(--highlight-border);   /* 明顯的琥珀金邊框 */
      box-shadow: 
        0 12px 30px -10px rgba(0, 0, 0, 0.8),
        0 0 25px var(--highlight-shadow);     /* 柔和微光暈 */
      z-index: 20;
      opacity: 1 !important;
      filter: blur(0px) !important;
    }

    /* 輪播啟動時，未被選中的卡片 (變暗 & 模糊) */
    .masonry-wall.has-highlight .card:not(.highlight) {
      opacity: 0.28;             /* 稍微變暗 */
      filter: blur(3px) grayscale(20%); /* 微模糊與低飽和度 */
      transform: scale(0.96);    /* 稍微縮小 */
    }
  </style>
</head>
<body>

  <!-- 頁頭資訊 -->
  <header>
    <h1>朋友對我的動態留言板</h1>
    <p>Words from Friends • Live Spotlight</p>
  </header>

  <!-- 載入中動畫 -->
  <div id="loading">
    <div class="loader-ring">
      <div></div><div></div><div></div><div></div>
    </div>
    <p>讀取留言中...</p>
  </div>

  <!-- 瀑布流留言牆容器 (預設隱藏，待資料載入後顯示) -->
  <main id="wall" class="masonry-wall" style="display: none;"></main>

  <!-- ==========================================================================
       JavaScript 邏輯處理
       ========================================================================== -->
  <script>
    // ==========================================================================
    // 【參數設定區】可在此修改「輪播秒數」與「試算表網址」
    // ==========================================================================
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRejB4sECnWgyu4pKu-FVj2sfVj1GU3U8zgFJbrMZ0IlKjyBQDWxS7bSSpozhYVxE5FsMEF_RqIhT4V/pub?output=csv';
    
    // 【輪播秒數修改區】：單位為毫秒 (ms)，3000ms = 3 秒
    const CAROUSEL_INTERVAL = 3000; 

    // 全局狀態變數
    let commentsData = [];
    let currentIndex = 0;
    let carouselTimer = null;

    // DOM 元素引用
    const loadingEl = document.getElementById('loading');
    const wallEl = document.getElementById('wall');

    // 當 DOM 載入完畢後開始執行串接
    document.addEventListener('DOMContentLoaded', () => {
      fetchComments();
    });

    /**
     * 1. 使用 fetch() 讀取 Google 試算表 CSV 網址
     */
    async function fetchComments() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路回應異常');
        
        const csvText = await response.text();
        
        // 解析 CSV 資料
        commentsData = parseCSV(csvText);

        // 隱藏 Loading 動畫，顯示留言牆
        loadingEl.style.display = 'none';
        wallEl.style.display = 'block';

        // 渲染留言卡片
        renderCards(commentsData);

        // 若有資料，開始啟動動態輪播
        if (commentsData.length > 0) {
          startCarousel();
        }
      } catch (error) {
        console.error('抓取資料時發生錯誤:', error);
        loadingEl.innerHTML = '<p style="color:#ef4444;">資料載入失敗，請稍後重新整理頁面。</p>';
      }
    }

    /**
     * 2. 健壯的 CSV 解析器 (Robust CSV Parser)
     * 妥善處理：雙引號包覆、包含逗號 (,)、以及換行字元 (CRLF) 的留言
     */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let currentField = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          // 處理轉義雙引號 ("")
          if (inQuotes && nextChar === '"') {
            currentField += '"';
            i++; 
          } else {
            inQuotes = !inQuotes; // 切換是否在引號內的狀態
          }
        } else if (char === ',' && !inQuotes) {
          // 遇到逗號且不在引號內，拆分欄位
          row.push(currentField.trim());
          currentField = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          // 遇到換行且不在引號內，結束當前這列
          if (char === '\r' && nextChar === '\n') {
            i++; 
          }
          row.push(currentField.trim());
          if (row.length > 1 || row[0] !== '') {
            lines.push(row);
          }
          row = [];
          currentField = '';
        } else {
          currentField += char;
        }
      }

      // 補足最後一行
      if (currentField !== '' || row.length > 0) {
        row.push(currentField.trim());
        lines.push(row);
      }

      // 切除第一行標題欄 (時間戳記, 名字, 要說的悄悄話)
      const dataRows = lines.slice(1);

      // 映射成 Javascript 物件陣列
      return dataRows.map(cols => {
        return {
          timestamp: cols[0] || '',
          name: cols[1] || '匿名朋友',
          content: cols[2] || '（這條留言沒有內容）'
        };
      });
    }

    /**
     * 3. 動態將資料生成為卡片 DOM 結構
     */
    function renderCards(data) {
      wallEl.innerHTML = '';

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.index = index;

        card.innerHTML = `
          <div class="card-header">
            <span class="card-name">${escapeHTML(item.name)}</span>
            <span class="card-time">${escapeHTML(item.timestamp)}</span>
          </div>
          <div class="card-content">${escapeHTML(item.content)}</div>
        `;

        // 【互動體驗加分】：懸停時暫停輪播，並將當前卡片設為焦點
        card.addEventListener('mouseenter', () => {
          stopCarousel();
          setHighlight(index);
        });

        // 移開滑鼠後繼續自動輪播
        card.addEventListener('mouseleave', () => {
          startCarousel();
        });

        wallEl.appendChild(card);
      });
    }

    /**
     * 4. 聚焦高亮 (Highlight) 特定索引卡片的邏輯
     */
    function setHighlight(index) {
      const cards = document.querySelectorAll('.card');
      if (cards.length === 0) return;

      // 在父容器加上標記類別，驅動非高亮卡片的淡化與模糊效果
      wallEl.classList.add('has-highlight');

      cards.forEach((card, i) => {
        if (i === index) {
          card.classList.add('highlight');
          
          // 平滑滾動確保焦點卡片在長頁面中始終可見
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('highlight');
        }
      });
    }

    /**
     * 5. 啟動計時器 (setInterval) 定時輪播
     */
    function startCarousel() {
      if (carouselTimer) clearInterval(carouselTimer);

      // 立即呈現當前高亮卡片
      setHighlight(currentIndex);

      // 設定每 CAROUSEL_INTERVAL 毫秒（預設 3 秒）切換下一張
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % commentsData.length; // 循環輪播
        setHighlight(currentIndex);
      }, CAROUSEL_INTERVAL);
    }

    /**
     * 6. 暫停計時器
     */
    function stopCarousel() {
      if (carouselTimer) {
        clearInterval(carouselTimer);
        carouselTimer = null;
      }
    }

    /**
     * 7. 防範 XSS 攻擊的字元轉義處理
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
